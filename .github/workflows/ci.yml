name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Unit and component tests
        run: npm test

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      # Builds the site and serves it with `vite preview` on its own port; no network access is needed.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the Playwright report when the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
