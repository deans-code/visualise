name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The least the Pages actions need: read the code, publish the site, and prove the deployment's identity.
permissions:
  contents: read
  pages: write
  id-token: write

# Only the latest deployment matters; a newer push cancels one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # A failing test stops the deployment, so the live site is always a build that passed.
      - run: npm test

      # The base path defaults to /visualise/, which must match the repository name (see the README).
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
